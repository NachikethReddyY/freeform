name: wmul-local

services:
  whiteboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_UID: ${LOCAL_UID:-1000}
        DEV_GID: ${LOCAL_GID:-1000}
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${FREEFORM_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ${FREEFORM_STATE_DIR:-./.wrangler/state}:/app/.wrangler/state
    command: ["pnpm", "dev:container"]

volumes:
  node_modules:
